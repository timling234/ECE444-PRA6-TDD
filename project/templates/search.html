{% extends 'base.html' %}{% block body %}<h2>Search</h2><form method="get"><label for="query">Search title or text</label><input id="query" name="query" value="{{ query }}" class="form-control"><button class="btn btn-info">Search</button></form><ul class="entries">{% for entry in entries %}<li class="entry"><h2 id="{{ entry.id }}">{{ entry.title }}</h2><div>{{ entry.text|safe }}</div>{% if session.logged_in %}<form class="delete-entry" method="post" action="{{ url_for('delete_entry', post_id=entry.id) }}"><button type="submit" class="btn btn-outline-danger btn-sm" aria-label="Delete {{ entry.title }}">Delete</button></form>{% endif %}</li>{% else %}{% if query %}<li>No matching entries.</li>{% endif %}{% endfor %}</ul>{% endblock %}
