{% extends 'base.html' %}{% block body %}
{% if session.logged_in %}<form method="post" action="{{ url_for('add_entry') }}"><label for="title">Title</label><input id="title" name="title" class="form-control" required><label for="text">Text</label><textarea id="text" name="text" class="form-control" required></textarea><button class="btn btn-primary">Share</button></form>{% endif %}
<ul class="entries">{% for entry in entries %}<li class="entry"><h2 id="{{ entry.id }}">{{ entry.title }}</h2>{{ entry.text|safe }}</li>{% else %}<li><em>No entries yet. Add some!</em></li>{% endfor %}</ul>{% endblock %}
