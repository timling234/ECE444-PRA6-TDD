services:
  - type: web
    name: ece444-pra6-tdd
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python create_db.py && gunicorn project.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ece444-pra6-db
          property: connectionString

databases:
  - name: ece444-pra6-db
    plan: free
    databaseName: flaskr
    user: flaskr
